[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mikotonet"
version = "0.1.0"
description = "Minimal permissioned Polytree financial ledger"
requires-python = ">=3.11"
dependencies = ["cryptography>=46,<51"]

[project.scripts]
mikotonet = "mikotonet.demo:main"
mikotonet-node = "mikotonet.network:main"

[tool.setuptools.packages.find]
include = ["mikotonet*"]
